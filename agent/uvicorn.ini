[uvicorn]
# Exclude the artifacts directory from file watching so --reload does not
# restart the server when worktrees (wt-*), clones, or run artifacts are
# created/modified during test runs. Each restart kills in-flight background
# pipeline tasks and causes the run to appear to hang.
reload_exclude = ["../artifacts/*", "artifacts/*", "*/wt-*/*", "*/clones/*"]
